name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PyQt6 needs these system libs to boot the offscreen platform.
      - name: Install Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1

      - name: Install Python deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        working-directory: pdf_reader/gui_app
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q
